[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bar_assembly_core"
version = "0.2.0"
description = "Shared core of the bar assembly tools: design format schema 2, robots, scenes and their mirrors"
readme = "README.md"
requires-python = ">=3.9"
# * Pins that Rhino 8's CPython 3.9 is known to work with: numpy 1.24.4, scipy 1.13.1, trimesh 4.12.2.
dependencies = ["numpy", "scipy", "trimesh"]

[project.optional-dependencies]
# * mirrors/ and legacy/. compas_fab comes from its `wip_process` branch: the PyPI release lacks `RigidBody`.
# legacy.export and legacy.conversion also need rs_data_structure (not on PyPI).
mirrors = [
    "compas", "compas_robots",
    "compas_fab @ git+https://github.com/compas-dev/compas_fab.git@995122dd467415971ca842772573a07d6c942145",
    "pybullet", "pybullet_planning==0.6.1", "roslibpy==1.8.1",
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["bar_assembly_core*"]

[tool.pytest.ini_options]
# * Quick by default: slow tests are skipped. Everything: pytest -m ""
addopts = "-m 'not slow'"
testpaths = ["tests"]
markers = ["slow: takes seconds: legacy conversions, Python 3.9 environments built by uv"]
